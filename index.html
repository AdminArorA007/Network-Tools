    <div class="container py-4">

            <div class="col-lg-8">
                <div class="test-form">
                    <h2 class="text-center mb-4"><i class="bi bi-wifi"></i> Network Diagnostics Tool</h2>
                    <form id="diagnosticsForm">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(document).ready(function(){
            const MIN_WAIT_TIME = 5; // 5 seconds between tests
            let lastTestTime = 0;
            let countdownInterval;

            // Form submission handler
            $("#diagnosticsForm").submit(function(e){
                e.preventDefault();
                
                const currentTime = Date.now();
                const timeSinceLastTest = (currentTime - lastTestTime) / 1000;
                
                // Check if enough time has passed
                if (timeSinceLastTest < MIN_WAIT_TIME) {
                    const waitTime = Math.ceil(MIN_WAIT_TIME - timeSinceLastTest);
                    showWaitMessage(waitTime);
                    startCountdown(waitTime);
                    return;
                }
                
                // If enough time has passed, run the test
                runTest();
                lastTestTime = currentTime;
            });

            // Function to run the diagnostic test
            function runTest() {
                const $submitBtn = $("#submitBtn");
                const $resultBody = $("#result-body");
                
                // Show loading state
                $submitBtn.prop('disabled', true).html('<i class="bi bi-hourglass"></i> Running...');
                $resultBody.html(`
                    <div class="text-center">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-2">Running test...</p>
                    </div>
                `);
                
                // Make AJAX request
                $.ajax({
                    type: "POST",
                    url: "process.php",
                    data: $("#diagnosticsForm").serialize(),
                    success: function(response) {
                        $resultBody.html(response);
                        resetSubmitButton();
                    },
                    error: function(jqXHR, textStatus) {
                        $resultBody.html(`
                            <div class="alert alert-danger">
                                <i class="bi bi-exclamation-triangle"></i> 
                                Error: ${textStatus === "error" ? "Request failed" : textStatus}
                            </div>
                        `);
                        resetSubmitButton();
                    }
                });
            }

            // Show wait message
            function showWaitMessage(seconds) {
                $("#result-body").html(`
                    <div class="alert alert-warning text-center">
                        <i class="bi bi-clock"></i> Please wait ${seconds} second(s) before running another test
                    </div>
                `);
            }

            // Start countdown timer
            function startCountdown(seconds) {
                const $submitBtn = $("#submitBtn");
                $submitBtn.prop('disabled', true).append(`<span id="countdown-badge">${seconds}</span>`);
                
                clearInterval(countdownInterval);
                
                countdownInterval = setInterval(function() {
                    const $badge = $("#countdown-badge");
                    let remaining = parseInt($badge.text()) - 1;
                    
                    $badge.text(remaining);
                    
                    if (remaining <= 0) {
                        clearInterval(countdownInterval);
                        resetSubmitButton();
                        $("#result-body").html('<div class="text-center text-muted">Ready for new test.</div>');
                    }
                }, 1000);
            }

            // Reset submit button to original state
            function resetSubmitButton() {
                $("#submitBtn")
                    .prop('disabled', false)
                    .html('<i class="bi bi-play-fill"></i> Run Test')
                    .find("#countdown-badge").remove();
            }
        });
    </script>
</body>
